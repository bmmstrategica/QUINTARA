<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quintara mobile, web and admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Quintara is a dark, evening brand: the same palette serves light and dark device settings by design. */
:root{--ink:#0A0B0C;--s1:#101113;--s2:#16181A;--s3:#1F2225;--line:#2A2D31;--ivory:#F4F0E6;--muted:#A49D8F;--champ:#C9AB72;--pos:#9CC7A8;--bar:#0c0d0e;--dim:#6f6a60;--goldline:#6f5f41;--posline:#3f5a48;--hover:#4a4d52;--err:#E3A39B;--scrim:10,11,12;--chrome:#0d0e0f;--dim2:#7d776c;--cardscrim:12,13,14;
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;--sans:"Jost","Avenir Next","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--ink:#FFFFFF;--s1:#FFFFFF;--s2:#F7F6F2;--s3:#EFEDE6;--line:#E5E2DB;--ivory:#161616;--muted:#686868;--champ:#183C32;--pos:#2F6B4F;--bar:#F7F6F2;--dim:#8C8C8C;--goldline:#9DB0A9;--posline:#A9C4B6;--hover:#C9C5BB;--err:#8F3F3F;--scrim:255,255,255;--chrome:#F7F6F2;--dim2:#8C8C8C;--cardscrim:12,13,14}
:root[data-theme="light"] .btn:not(.ghost),:root[data-theme="light"] .themebar button[aria-pressed="true"]{background:#111111;border-color:#111111;color:#FFFFFF}
:root[data-theme="light"] img[src^="data:image/png"]{filter:brightness(0)}
/* Photographs and the membership card keep the dark treatment in the light look, so imagery reads the same in both. */
:root[data-theme="light"] :is(.media,.feature,.mcard,.qr){--ink:#0A0B0C;--s1:#101113;--s2:#16181A;--s3:#1F2225;--line:#2A2D31;--ivory:#F4F0E6;--muted:#A49D8F;--champ:#C9AB72;--pos:#9CC7A8;--dim:#6f6a60;--goldline:#6f5f41;--posline:#3f5a48;--scrim:10,11,12;color:var(--ivory)}
:root[data-theme="light"] :is(.media,.feature,.mcard,.qr) img[src^="data:image/png"]{filter:none}
.qdoc{background:var(--s2);border:1px solid var(--line);border-top:2px solid var(--champ);border-radius:4px;padding:28px 22px;max-width:760px;display:flex;flex-direction:column;gap:6px}
.qdoc-head{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}.qdoc-head img:first-child{height:52px}.qdoc-head img:last-child{height:12px}
.qdoc-eye{margin:0;text-align:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--champ)}
.qdoc h2{margin:6px 0 0;text-align:center;font:italic 400 34px/1.1 var(--serif)}.qdoc-sub,.qdoc-for{margin:0;text-align:center}.qdoc-for{color:var(--muted);font-size:13px;letter-spacing:.06em}
.qdoc section{margin-top:22px}.qdoc h3{margin:0;padding-bottom:8px;border-bottom:1px solid var(--champ);font:italic 400 22px/1.2 var(--serif)}
.qdoc-item{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.qdoc-item>span{color:var(--champ);font-variant-numeric:tabular-nums}.qdoc-item b{font-weight:500}.qdoc-item p{margin:3px 0 0;color:var(--muted);font-size:14px}.qdoc-item .bk{font-size:12.5px;font-style:italic}
.qdoc-foot{margin-top:22px;font-size:12.5px;color:var(--muted)}.qdoc-foot p{margin:0 0 6px}
#printdoc{display:none}
@media print{body>*{display:none!important}body>#printdoc{display:block!important}body{background:#fff!important}
  #printdoc .qdoc{--s2:#fff;--line:#DDD8CC;--champ:#7D6838;--ivory:#161616;--muted:#555;color:#161616;border:0;border-top:2px solid #7D6838;max-width:none;padding:0}#printdoc img{filter:brightness(0)!important}}
.themebar{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:12px}
.themebar button{background:none;border:0;padding:8px 16px;font:400 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.themebar button[aria-pressed="true"]{background:var(--ivory);color:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--ivory);font:400 15px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--champ);outline-offset:3px}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Presentation page ---------- */
.mast{display:flex;flex-direction:column;align-items:center;gap:18px;padding:44px 20px 26px;text-align:center}
.mast img{width:150px;height:auto;display:block}
.mast p{margin:0;color:var(--muted);max-width:46ch;font-weight:300}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.switch button{background:none;border:0;border-radius:999px;padding:9px 22px;color:var(--muted);letter-spacing:.04em;font-size:13px;transition:background .2s,color .2s}
.switch button[aria-pressed="true"]{background:var(--ivory);color:var(--ink)}
.stage{padding:8px clamp(8px,3vw,40px) 64px}
.stage[hidden]{display:none}

/* ---------- Frames ---------- */
.app{background:var(--s1);color:var(--ivory);display:flex;overflow:hidden;position:relative}
.phone{width:min(392px,100%);height:min(848px,calc(100vh - 40px));min-height:600px;margin:0 auto;flex-direction:column;border:11px solid #000;border-radius:52px;box-shadow:0 0 0 1px #2c2e31,0 50px 90px -40px #000}
.phone::before{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:28px;border-radius:20px;background:#000;z-index:6}
.webwrap{overflow-x:auto;padding-bottom:8px}
.browser{width:100%;min-width:1060px;max-width:1360px;height:min(860px,calc(100vh - 40px));min-height:620px;margin:0 auto;flex-direction:column;border:1px solid var(--line);border-radius:12px;box-shadow:0 50px 90px -50px #000}
.chrome{display:flex;align-items:center;gap:7px;padding:11px 14px;background:var(--chrome);border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.chrome span{flex:1;max-width:420px;margin:0 auto;text-align:center;font-size:12px;color:var(--muted);background:var(--s2);border-radius:6px;padding:4px 10px}
.shell{flex:1;display:flex;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;container-type:inline-size;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.phone .scroll{scrollbar-width:none}
.phone .scroll::-webkit-scrollbar{display:none}

/* ---------- Phone navigation ---------- */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:50px 18px 10px;min-height:98px}
.ptop .word{height:15px;width:auto;display:block}
.ptop .title{font-family:var(--serif);font-size:20px;letter-spacing:.01em;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.ptop .act{display:flex;gap:2px;z-index:1}
.iconbtn{position:relative;width:42px;height:42px;display:grid;place-items:center;background:none;border:0;border-radius:50%;color:var(--ivory)}
.iconbtn:hover{background:var(--s3)}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--champ);box-shadow:0 0 0 2px var(--s1)}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 10px 22px;background:var(--bar);border-top:1px solid var(--line)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:10px 0 4px;color:var(--muted);font-size:10.5px;letter-spacing:.05em;transition:color .2s}
.tabbar button[aria-current="page"]{color:var(--ivory)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:0;width:18px;height:1.5px;background:var(--champ)}
.tabbar .qera{padding-top:0}
.tabbar .qera .orb{width:50px;height:50px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--champ);color:var(--champ);transition:background .2s,color .2s}
.tabbar .qera[aria-current="page"] .orb{background:var(--champ);color:var(--ink)}
.tabbar .qera[aria-current="page"]::before{display:none}

/* ---------- Web navigation ---------- */
.side{width:244px;flex:none;display:flex;flex-direction:column;background:var(--bar);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.side .logo{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px 22px;background:none;border:0;border-bottom:1px solid var(--line);width:100%}
.side .logo .m{height:44px;width:auto}
.side .logo .w{height:13px;width:auto}
.side h4{margin:20px 24px 6px;font:400 11.5px/1 var(--sans);letter-spacing:.14em;color:var(--dim2)}
.side nav button{position:relative;display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;padding:9px 24px;color:var(--muted);text-align:left;font-size:14.5px;transition:color .15s,background .15s}
.side nav button:hover{color:var(--ivory)}
.side nav button[aria-current="page"]{color:var(--ivory);background:var(--s2)}
.side nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--champ)}
.side nav button .count{margin-left:auto;font-size:11px;color:var(--ink);background:var(--champ);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:16px 20px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.me small{display:block;color:var(--muted);font-size:12px}
.wtop{display:flex;align-items:center;gap:10px;padding:12px 36px;border-bottom:1px solid var(--line)}
.wtop .search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;color:var(--muted);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:40px}
.wtop .search input{flex:1;background:none;border:0;outline:0;min-width:0}
.wtop .sp{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--line);background:var(--s3);font-family:var(--serif);font-size:15px;color:var(--ivory)}
.avatar.lg{width:52px;height:52px;font-size:20px}

/* ---------- Content ---------- */
.scr{padding:6px 18px 30px;display:flex;flex-direction:column;gap:16px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr{animation:none}}
.crumb{display:none}
.eyebrow{color:var(--muted);font-size:13px;letter-spacing:.04em;margin:0}
.h{font:400 34px/1.08 var(--serif);margin:0;letter-spacing:.005em}
.h em{font-style:italic}
.lede{color:var(--muted);font-weight:300;margin:0;max-width:60ch}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.sec h3{font:italic 400 21px/1.2 var(--serif);margin:0}
.textlink{background:none;border:0;padding:6px 0;color:var(--champ);font-size:13px;letter-spacing:.03em}
.textlink:hover{text-decoration:underline;text-underline-offset:4px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--ivory);background:var(--ivory);color:var(--ink);font-weight:500;font-size:14px;letter-spacing:.04em;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:none;color:var(--ivory);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted);opacity:1}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 16px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.chip.gold{color:var(--champ);border-color:var(--goldline)}
.chip.ok{color:var(--pos);border-color:var(--posline)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.filters .chip{height:34px;padding:0 16px;font-size:13px}
.filters .chip.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.rule{height:1px;background:var(--line)}

.feature::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(var(--scrim),.96) 18%,rgba(var(--scrim),.72))}
.feature>*{position:relative;z-index:1}
.feature>.hslide{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .9s;background:center/cover no-repeat}.feature>.hslide.on{opacity:1}.hslide video{width:100%;height:100%;object-fit:cover;display:block}
.feature.slides::after{background:linear-gradient(0deg,rgba(var(--scrim),.94) 12%,rgba(var(--scrim),.45) 55%,rgba(var(--scrim),.2))}
.feature .t{font:italic 400 32px/1.05 var(--serif)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:6px 0;color:var(--muted);font-size:11.5px;letter-spacing:.03em}
.quick .ring{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ivory);transition:border-color .2s,color .2s}
.quick button:hover .ring{border-color:var(--champ);color:var(--champ)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;min-height:64px}
.row:first-child{border-top:1px solid var(--line)}
.row .lead{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--champ)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .txt b{font-weight:400;font-size:15.5px}
.row .txt span{color:var(--muted);font-size:13px;font-weight:300}
.row .go{color:var(--dim)}
.row[data-go]:hover .txt b{color:var(--champ)}
.row .unread{width:7px;height:7px;border-radius:50%;background:var(--champ);flex:none}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 6px 16px;background:var(--s2);border:1px solid var(--line);border-radius:6px;color:var(--ivory);font-size:12.5px;letter-spacing:.02em;transition:border-color .2s}
.menu button:hover{border-color:var(--champ)}
.menu svg{color:var(--champ);width:24px;height:24px}
.ticket{display:flex;gap:16px;align-items:center;padding:16px;background:var(--s2);border:1px solid var(--line);border-radius:6px;text-align:left;width:100%}
.ticket .d{display:flex;flex-direction:column;align-items:center;padding-right:16px;border-right:1px dashed var(--line);color:var(--muted);font-size:12px}
.ticket .d b{font:400 30px/1 var(--serif);color:var(--ivory)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.kv div{display:flex;flex-direction:column;gap:2px}
.kv span{color:var(--muted);font-size:12.5px;letter-spacing:.03em}
.panel{background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--champ)}
.note{border-left:1px solid var(--champ);padding:2px 0 2px 14px;color:var(--muted);font-size:13.5px;font-weight:300}
.note strong{color:var(--ivory);font-weight:500}
.steps{list-style:none;display:flex;gap:4px;padding:0;margin:0}
.steps li{flex:1;padding-top:10px;border-top:2px solid var(--line);font-size:11px;color:var(--dim);line-height:1.25}
.steps li.done{border-color:var(--ivory);color:var(--muted)}
.steps li.now{border-color:var(--champ);color:var(--ivory)}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{align-self:flex-start;max-width:84%;padding:11px 15px;background:var(--s2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;font-size:14.5px}
.msg.mine{align-self:flex-end;background:var(--ivory);color:var(--ink);border-color:var(--ivory);border-radius:16px 16px 4px 16px}
.msg small{display:block;opacity:.6;font-size:11px;margin-top:3px}
.msg.ask{border-color:var(--goldline);display:flex;flex-direction:column;gap:12px;max-width:94%}
.seen{align-self:flex-end;font-size:11.5px;color:var(--muted);margin-top:-4px}
.composer{display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 18px}
.composer input{flex:1;min-width:0;background:none;border:0;outline:0;height:40px}
.composer button{width:40px;height:40px;border-radius:50%;border:0;background:var(--ivory);color:var(--ink);display:grid;place-items:center;flex:none}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);letter-spacing:.03em}
.field input,.field textarea{background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:13px 14px;color:var(--ivory);outline:0}
.field input:focus,.field textarea:focus{border-color:var(--champ)}
.field textarea{min-height:104px;resize:vertical}
.searchbar{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;background:var(--s2);border:1px solid var(--line);border-radius:999px;color:var(--muted)}

1p/Fe8pS+MkGv/do5nRiiY0GyRbvW66QWVcT/B/yAyqvxeRIiAAAAAElFTkSuQmCC) center/38% no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:10px;color:var(--dim)}
.pref{display:flex;justify-content:space-between;align-items:center;min-height:50px;border-bottom:1px solid var(--line)}
.toggle{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--s3);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle:checked{background:var(--champ);border-color:var(--champ)}
.toggle:checked::after{transform:translateX(18px);background:var(--ink)}
.price{font:400 30px/1 var(--serif)}
.cols{display:flex;flex-direction:column;gap:18px}
.cols>*{display:flex;flex-direction:column;gap:14px;min-width:0}
.gridx{display:flex;flex-direction:column;gap:14px}

/* Wide layout: the same screens rearrange inside the browser frame. */
@container (min-width:720px){
  .scr{padding:34px 44px 60px;gap:22px;max-width:1120px}
  .crumb{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--muted);font-size:13px;letter-spacing:.03em;align-self:flex-start}
  .crumb:hover{color:var(--ivory)}
  .crumb svg{width:16px;height:16px}
  .h{font-size:48px}
  .sec h3{font-size:25px}
  .cols{flex-direction:row;gap:48px;align-items:flex-start}
  .cols>*{flex:1}
  .cols>.narrow{flex:0 0 340px}
  .gridx,.hscroll{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0;padding:0;overflow:visible}
  .gridx.two{grid-template-columns:repeat(2,1fr)}
  .filters{margin:0;padding:0}
  .feature{min-height:360px;padding:36px}
  .feature .t{font-size:46px}
  .quick{grid-template-columns:repeat(4,96px)}
  .menu{grid-template-columns:repeat(5,1fr)}
  .btn.full{width:auto;align-self:flex-start}
  .thread,.composer{max-width:660px}
  .media{--h:200px}
  .phoneonly{display:none}
}

.center{min-height:100%;justify-content:center;align-items:center}
.welcome{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;max-width:340px;margin:auto;padding:20px 0}
.welcome>img{width:190px;height:auto}
.stackbtns{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:10px}
.stackbtns .btn.full{width:100%;align-self:stretch}
.lockcard{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:44px 10px;max-width:420px;margin:0 auto}
.ringlock{width:60px;height:60px;border-radius:50%;border:1px solid var(--champ);color:var(--champ);display:grid;place-items:center}
.lockmark{margin-left:auto;color:var(--dim);display:flex}.lockmark svg{width:14px;height:14px}
.err{color:var(--err);font-size:12.5px;letter-spacing:0}
.field input[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-color:var(--err)}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:999px;padding:3px}
.stepper b{font:400 20px/1 var(--serif)}
.iconbtn:disabled{opacity:.35;cursor:default}
.btn:disabled{opacity:.5;cursor:default}
.total{display:flex;justify-content:space-between;align-items:baseline}
.tix{max-width:440px}
button.chip{background:none;cursor:pointer;font-family:inherit}
.filters button.chip.on{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
form.searchbar,form.search,form.composer{margin:0}
.banner{margin:0;padding:10px 0;border-top:1px solid var(--goldline);border-bottom:1px solid var(--goldline);color:var(--champ);font-size:13.5px;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;background:var(--s2);border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:13px;transition:border-color .2s}
.stat:hover{border-color:var(--champ)}
.stat b{font:400 44px/1 var(--serif);color:var(--ivory)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field input[type=date]{color-scheme:dark}
.qhelp{font-size:12.5px;color:var(--muted);letter-spacing:0}
.wa{--wa-bar:#1F2C34;--wa-bg:#0B141A;--wa-in:#202C33;--wa-out:#005C4B;--wa-text:#E9EDEF;--wa-meta:#8696A0;--wa-link:#53BDEB;--wa-input:#2A3942;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;max-width:520px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.25)}
:root[data-theme="light"] .wa{--wa-bar:#075E54;--wa-bg:#EFEAE2;--wa-in:#FFFFFF;--wa-out:#D9FDD3;--wa-text:#111B21;--wa-meta:#667781;--wa-link:#027EB5;--wa-input:#FFFFFF}
.wa-top{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--wa-bar);color:#fff}
.wa-top .av{width:38px;height:38px;border-radius:50%;background:#0A0B0C;display:grid;place-items:center;flex:none}
.wa-top .av img{width:22px;filter:none!important}
.wa-top b{font-weight:500;font-size:15px;display:flex;align-items:center;gap:6px}
.wa-top small{display:block;font-size:12px;opacity:.75}
.wa-top .tick{width:15px;height:15px;border-radius:50%;background:#25D366;display:inline-grid;place-items:center;color:#0B141A;font-size:10px;font-weight:700}
.wa-body{background:var(--wa-bg);padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-height:300px;max-height:460px;overflow:auto}
.wa-body>*{flex:none}
.wa-day{align-self:center;font-size:11.5px;color:var(--wa-meta);background:var(--wa-in);padding:4px 10px;border-radius:8px;margin:4px 0}
.wa-sys{align-self:center;max-width:88%;text-align:center;font-size:11.5px;line-height:1.45;color:#C9A64B;background:rgba(255,236,170,.08);padding:6px 10px;border-radius:8px}
:root[data-theme="light"] .wa-sys{color:#54656F;background:#FFEECD}
.wa-msg{max-width:82%;padding:7px 9px 6px;border-radius:8px;font-size:14px;line-height:1.42;color:var(--wa-text);background:var(--wa-in);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.wa-msg.me{background:var(--wa-out);align-self:flex-end}
.wa-msg .meta{display:block;text-align:right;font-size:10.5px;color:var(--wa-meta);margin-top:2px}
.wa-msg .meta .ticks{color:var(--wa-link);margin-left:3px;letter-spacing:-3px}
.wa-msg.ask{padding:0;overflow:hidden;min-width:240px}
.wa-msg.ask .q{padding:7px 9px 4px;display:block}
.wa-msg.ask .meta{padding:0 9px 6px}
.wa-msg.ask button{display:block;width:100%;background:none;border:0;border-top:1px solid rgba(134,150,160,.25);color:var(--wa-link);font:500 14px/1 var(--sans, inherit);padding:11px 0;cursor:pointer}
.wa-msg.ask button:disabled{color:var(--wa-meta);cursor:default}
.wa-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;background:var(--wa-bg)}
.wa-chips button{flex:none;border:1px solid rgba(134,150,160,.35);background:var(--wa-in);color:var(--wa-text);border-radius:16px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.wa-comp{display:flex;gap:8px;align-items:center;padding:8px 10px 10px;background:var(--wa-bg)}
.wa-comp input{flex:1;border:0;border-radius:22px;padding:11px 15px;background:var(--wa-input);color:var(--wa-text);font-size:14px;outline:0}
.wa-comp button{width:42px;height:42px;border-radius:50%;border:0;background:#00A884;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.wa-comp button .ic{width:18px;height:18px}
.wa-code{font:400 40px/1.1 var(--serif);letter-spacing:.06em;color:var(--ivory);margin:4px 0}
.walink{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.walink{grid-template-columns:1fr}}
#phone .walink{grid-template-columns:1fr}
.choicegrp{display:flex;flex-direction:column;gap:8px;border:0;padding:0;margin:0}
.choicegrp legend{font-size:13px;color:var(--muted);letter-spacing:.03em;padding:0;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px}
.opts label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ivory)}
.opts input{accent-color:var(--champ)}
.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rescard{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--ivory);text-align:left;font:inherit;cursor:pointer}
.rescard small{color:var(--muted);font-size:12.5px}
.rescard[aria-pressed="true"]{border-color:var(--champ);box-shadow:inset 0 0 0 1px var(--champ)}
.plangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.plancard{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .2s}
.plancard input{position:absolute;opacity:0;pointer-events:none}
.plancard .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Order tracking: the five steps, across in the web app and the admin console, down on the phone and in the shop */
.otrack{list-style:none;margin:4px 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}

.otrack li:last-child::after{display:none}

.otrack li.now{color:var(--ivory)}.otrack li.now::before{background:var(--champ);border-color:var(--champ);box-shadow:0 0 0 4px rgba(201,171,114,.22)}

.mzorder .oh{display:flex;justify-content:space-between;font-family:var(--did);font-size:18px}.mzorder .oh b{font-weight:400}.mzorder .nt{margin:0}
.mzda{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.mz .mbtn.ghost{background:none;color:var(--g)}

.ped{position:fixed;inset:0;z-index:300;background:rgba(10,11,12,.72);display:grid;place-items:center;padding:20px;font-family:'Jost',sans-serif;color:var(--ivory)}
.pedin{width:min(980px,100%);max-height:100%;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:18px}
.pedhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.pedhead h2{margin:0;font:400 28px/1.15 'Cormorant Garamond',serif}.pedhead p{margin:4px 0 0;font-size:13.5px}
.pedgrid{display:grid;grid-template-columns:minmax(0,560px) minmax(240px,1fr);gap:22px;align-items:start}
.pedprev{min-width:0;display:flex;flex-direction:column;gap:8px}.pedprev canvas{display:block;max-width:100%;border-radius:4px;background:#000}.pedfile{font-size:12.5px;margin:0}
.pedset{display:flex;flex-direction:column;gap:12px}.pedset select{background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:11px 12px;color:var(--ivory);font:inherit}
.pedset input[type=range]{accent-color:var(--champ);padding:0;border:0;background:none}.pedout{margin:0;font-size:13px}
@media (max-width:760px){.pedgrid{grid-template-columns:1fr}}

.qrbox{width:168px;height:168px;margin:0 auto;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#555;font-size:11px;letter-spacing:.06em;background-image:repeating-linear-gradient(0deg,#0000 0 6px,#e8e8e8 6px 7px),repeating-linear-gradient(90deg,#0000 0 6px,#e8e8e8 6px 7px)}
.qrbox img{width:40px;filter:brightness(0)!important}
.mfakey{display:inline-block;margin-top:6px;font-size:13px;letter-spacing:.06em;user-select:all;word-break:break-all}
.reccodes{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left}.reccodes code{font-size:14px;letter-spacing:.05em}
.codein{font-size:22px!important;letter-spacing:.35em}
.seats{display:flex;gap:6px}.seats i{width:26px;height:8px;border-radius:4px;background:var(--line)}.seats i.on{background:var(--champ)}
.alog{display:flex;flex-direction:column}.arow{display:grid;grid-template-columns:140px 160px minmax(0,1fr) 170px;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.arow time,.arow .m{color:var(--muted);font-size:12.5px}.arow .w small{display:block;color:var(--muted);font-size:12px}
@media (max-width:900px){.arow{grid-template-columns:1fr}}

/* Push banners, the system permission prompt, Face ID and the app lock (mobile app only) */
.pushbn{position:absolute;top:44px;left:10px;right:10px;z-index:30;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:18px;background:rgba(40,42,46,.94);backdrop-filter:blur(14px);color:#fff;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);animation:pbin .35s ease;cursor:pointer;text-align:left;border:0;font:inherit}
.pushbn img{width:30px;height:30px;border-radius:7px;background:#0A0B0C;padding:3px}
.pushbn b{display:block;font-weight:500;font-size:13px}.pushbn span{font-size:13px;opacity:.9}.pushbn small{margin-left:auto;font-size:11px;opacity:.6}
@keyframes pbin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.sysov{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;border-radius:40px}
.sysalert{width:270px;border-radius:14px;background:rgba(242,242,247,.97);color:#000;text-align:center;overflow:hidden;font-size:13px}
.sysalert .t{padding:18px 16px 4px;font-weight:600;font-size:15px}.sysalert .m{padding:0 16px 16px;color:#333}
.sysalert .b{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #c8c8cc}.sysalert .b button{border:0;background:none;padding:12px;font:inherit;font-size:15px;color:#0a64d8;cursor:pointer}.sysalert .b button+button{border-left:1px solid #c8c8cc;font-weight:600}
.faceid{width:150px;height:150px;border-radius:26px;background:rgba(30,30,32,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:13px}
.faceid svg{width:58px;height:58px;stroke:#fff;fill:none;stroke-width:2.4;animation:fid 1s ease-in-out}
.faceid.ok svg{stroke:#34c759}
@keyframes fid{0%{opacity:.3;transform:scale(.9)}50%{opacity:1}100%{transform:none}}
.lockov{position:absolute;inset:0;z-index:35;background:var(--ink);color:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;border-radius:40px}
.lockov img.m{height:64px;width:auto;opacity:.9}.lockov h2{font:400 28px/1.1 var(--serif);margin:0}
.lockov .btns{flex-direction:column;align-self:stretch}
.cover{position:absolute;inset:0;z-index:34;background:var(--ink);display:flex;align-items:center;justify-content:center;border-radius:40px}
/* Membership */
.mstate{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.mstate.ok{color:#5fbf8a;border-color:#5fbf8a}.mstate.due{color:var(--champ);border-color:var(--champ)}.mstate.bad{color:#e07a6f;border-color:#e07a6f}
.cardrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.cardrow .brand{font-weight:600;letter-spacing:.06em;font-size:12px;padding:4px 8px;border-radius:6px;background:var(--s3)}
.confirmbox{border:1px solid var(--champ);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
/* Insights (admin) */
.ins-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ins-tile{background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.ins-tile .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.ins-tile .v{font:400 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}.ins-tile .d{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:none;color:var(--muted);padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--ivory);color:var(--ink)}
.viz{--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500;--series-5:#d55181}
:root[data-theme="light"] .viz,body.light .viz{--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100;--series-5:#e87ba4}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);list-style:none;margin:0;padding:0}.vlegend li{display:inline-flex;align-items:center;gap:6px}.vlegend i{width:10px;height:10px;border-radius:2px}.vlegend b{color:var(--ivory);font-weight:500}
.cols3{display:grid;grid-template-columns:44px 1fr;gap:0;height:220px;margin-top:10px}
.yax{display:flex;flex-direction:column-reverse;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;padding-right:8px;height:200px}
.plot{position:relative;height:200px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--muted);background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 50px)}
.colm{flex:1;height:100%;display:flex;flex-direction:column-reverse;align-items:center;position:relative;outline:none;cursor:default}
.colm .stk{width:68%;max-width:34px;display:flex;flex-direction:column-reverse;gap:2px}
.colm .stk i{display:block;width:100%}.colm .stk i:last-child{border-radius:4px 4px 0 0}
.colm .xl{position:absolute;bottom:-20px;font-size:11px;color:var(--muted);white-space:nowrap}
.colm:hover,.colm:focus{background:rgba(255,255,255,.04)}
.colm .tipx{display:none;position:absolute;bottom:calc(100% - 40px);left:50%;transform:translateX(-50%);z-index:4;min-width:200px;white-space:nowrap;background:var(--s1);color:var(--ivory);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.35);text-align:left}
.colm:hover .tipx,.colm:focus .tipx{display:block}
.tipx div{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}.tipx div span:last-child{color:var(--ivory);font-variant-numeric:tabular-nums}.tipx .t{color:var(--ivory);font-weight:500;margin-bottom:4px;display:block}
.grp .stk{flex-direction:row;align-items:flex-end;gap:2px;height:100%}.grp .stk i{flex:1;border-radius:4px 4px 0 0}
</style>
</head>

/* ---------- QÉRA as Chief of Staff ---------- */
function briefData() {
  const today = qToday(), until = qAdd(today, 7), weekday = qNoon(today).getUTCDay();
  const week = [
    ...EX().filter(e => liveBooking(e.id) && expIso(e) && expIso(e) >= today && expIso(e) < until).map(e => [e.title, `${e.when}. ${liveBooking(e.id).seats} seat${liveBooking(e.id).seats > 1 ? 's' : ''}, ${liveBooking(e.id).status.toLowerCase()}.`, go('experience', e.id)]),
    ...PB().filter(b => ['Sent to the partner','Confirmed'].includes(b.status) && b.date >= today && b.date < until).map(b => [b.partner, `${qWhen(b)}, for ${b.size}. ${b.status === 'Confirmed' ? 'Confirmed' : 'Waiting for the partner'}.`, '']),
    ...SQ().filter(r => !r.guest && !r.cancelled && r.date && r.date >= today && r.date < until).map(r => [r.service, `${qLong(r.date)}${r.pkg ? '. ' + r.pkg : ''}. ${SREQ_STEPS[r.step]}.`, '']),
    ...REM().filter(r => r.status === 'Scheduled' && r.date < until).map(r => ['Reminder: ' + r.text, remWhen(r), '']),
  ];
  const dates = MEM().filter(m => m.kind === 'date' && m.date).map(m => [m, nextOcc(m.date, today)]).filter(([, n]) => daysTo(today, n) <= 30).sort((a, b) => a[1].localeCompare(b[1]))
    .map(([m, n]) => { const k = daysTo(today, n); return [m.label, `${qLong(n)}, ${k === 0 ? 'today' : k === 1 ? 'tomorrow' : 'in ' + k + ' days'}. Shall I plan something?`, act('qask', 'Plan a day for ' + m.label.toLowerCase() + ' on ' + n)]; });
  const likes = MEM().filter(m => m.kind === 'likes' || m.kind === 'favourite').map(m => m.label.toLowerCase());
  const fits = t => likes.filter(l => t.toLowerCase().includes(l)).length;
  const chosen = EX().filter(e => !liveBooking(e.id) && !needsInvite(e) && seatsLeft(e) > 0 && expIso(e) && expIso(e) >= today).map((e, i) => [e, fits(e.title + ' ' + e.cat + ' ' + e.sum) * 10 - i]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([e]) => [e.title, `${e.cat}. ${e.when}, ${e.place}.`, go('experience', e.id)]);
  const svc = SV().filter(x => x.status === 'Offered' && pkgsOf(x).length).sort((a, b) => fits(b.name + ' ' + b.sum) - fits(a.name + ' ' + a.sum))[0];
  const worth = svc ? [[svc.name, `${pkgsOf(svc)[0][0]}: ${pkgPrice(pkgsOf(svc)[0])}, ${pkgNotice(pkgsOf(svc)[0][4]).toLowerCase()}.`, go('service', svc.id)]] : [];
  const hour = new Date(Date.now() + 2 * 3600000).getUTCHours();
  return {weekday, greeting: `${hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening'}, ${DB.me.name.split(' ')[0]}. ${week.length ? 'You have ' + week.length + ' thing' + (week.length > 1 ? 's' : '') + ' this week.' : 'Your week is clear.'}`, sections: [['Your week', week], ['Coming up', dates], ['Chosen for you', chosen], ['Worth a look', worth]]};
}
function briefHtml() { const b = briefData(); return `<div class="panel" aria-label="Your week"><b style="font-weight:500">Your brief</b><span>${esc(b.greeting)}</span>
  ${b.sections.filter(([, items]) => items.length).map(([t, items]) => `<div><p class="eyebrow" style="margin:6px 0 2px">${esc(t)}</p><div class="list">${items.map(([title, detail, attr]) => row(attr, '', title, detail)).join('')}</div></div>`).join('')}
  <span class="muted" style="font-size:12.5px">${DB.privacy.brief === false ? 'The Monday brief is off. Switch it on under Profile, Privacy.' : 'QÉRA sends this to you every Monday morning, with reminders of dates and bookings.'}</span></div>`; }
function remindersHtml(f) { const list = REM().filter(r => r.status === 'Scheduled'); return `<div class="panel" aria-label="Reminders"><b style="font-weight:500">Reminders</b>
  ${list.length ? `<div class="list">${list.map(r => row('', lead('bell'), r.text, remWhen(r), `<button class="textlink" ${act('remcancel', r.id)}>Cancel</button>`)).join('')}</div>` : '<span class="muted" style="font-size:13.5px">Nothing to remind you of. Add one, or tell QÉRA “remind me to … on Friday at 10am”.</span>'}
  <form ${act('remadd')} style="display:flex;flex-direction:column;gap:10px"><label class="field">Remind me to<input name="rtext" maxlength="200"></label><div class="formgrid"><label class="field">Date<input name="rdate" type="date" min="${qToday()}"></label><label class="field">Time<input name="rtime" type="time" value="09:00"></label></div>${f && f.err && f.err.rem ? `<span class="err" role="alert">${esc(f.err.rem)}</span>` : ''}${btn('Add reminder', '', 'sm')}</form></div>`; }
function memSuggestions() { const known = new Set(MEM().map(m => m.label.toLowerCase())), out = [];
  const counts = {}; PB().filter(b => b.status !== 'Cancelled').forEach(b => { counts[b.partner] = (counts[b.partner] || 0) + 1; });
  Object.entries(counts).filter(([n]) => !known.has(n.toLowerCase())).slice(0, 3).forEach(([n, c]) => out.push(['favourite', n, `You have booked ${n} ${c === 1 ? 'once' : c + ' times'} through QÉRA.`]));
  if (liveBooking('costa') && !known.has('retreats')) out.push(['likes', 'Retreats', 'You have booked retreat experiences.']);
  return out; }
/* Due reminders arrive as notifications, as they would from the server. */
setInterval(() => { const now = new Date(Date.now() + 2 * 3600000).toISOString().slice(0, 16).replace('T', ' '); let sent = false;
  REM().filter(r => r.status === 'Scheduled' && `${r.date} ${r.time}` <= now).forEach(r => { r.status = 'Sent'; note('bell', 'Reminder from QÉRA: ' + r.text, 'qera'); sent = true; });
  if (sent) { save(); frames.forEach(x => { if (x.kind !== 'admin' && x.screen !== 'qera') x.render(true); }); } }, 30000);

  if (/privilege|benefit/.test(s)) return 'You can redeem:\n' + PV().filter(v => !v.limit || (DB.privUsed[v.id] || 0) < v.limit).map(v => `${v.title}, ${v.partner}`).join('\n');
  if (/tell me about/.test(s)) { const p = PAH().find(x => s.includes(x.name.toLowerCase())); if (p) return `${p.name}, ${p.place}. ${p.desc}\n\nThey offer: ${p.services}.\nYour benefit: ${p.benefit}.\n\nTell me a date and for how many, and I will book it.`; }
  if (/^(hi|hello|hey|help)\b|what can you do/.test(s.trim())) return Q_HELP;
  if (text.trim().length >= 25) return qRefer(text, 'I could not find that at Quintara, and it is not something I can arrange myself.');
  return Q_HELP;
}

    case 'wish': { const k = DB.wish.indexOf(arg); k < 0 ? DB.wish.push(arg) : DB.wish.splice(k, 1); toast(k < 0 ? 'Added to wishlist' : 'Removed from wishlist'); break; }
    case 'block': { const k = DB.blocked.indexOf(arg); if (k < 0) { DB.blocked.push(arg); delete DB.conn[arg]; DB.chats = DB.chats.filter(c => c.id !== arg); f.screen = 'members'; f.id = null; keep = false; toast('Blocked'); } else { DB.blocked.splice(k, 1); toast('Unblocked'); } break; }
    case 'report': DB.reports.unshift({id:arg, reason:val('reason'), detail:val('detail')}); toast('Report sent to the team'); break;
    case 'closereport': { const [n, how] = arg.split(':'), r = DB.reports[+n]; r.closed = how; if (how === 'Suspended') DB.suspended[r.id] = true; break; }
    default: return;
  }
  if (f.kind === 'admin' && ACT_WORDS[name] && !/^(staff|audit)/.test(name)) logAudit('action', ACT_WORDS[name], arg && !/^\d+$/.test(arg) ? String(arg) : '');
  save();
  (all ? frames : [f]).forEach(x => x.render(x === f ? keep : true));
}

function mzRun(action, form) {
  const i = action.indexOf(':'), name = i < 0 ? action : action.slice(0, i), arg = i < 0 ? '' : action.slice(i + 1);
  const val = k => form && form.elements[k] ? form.elements[k].value.trim() : '';

  if (name === 'top') { mz.el.querySelector('.mzscroll').scrollTop = 0; return; }
  if (name === 'collection') { mz.sheet = null; mz.render(); const c = mz.el.querySelector('#mzcollection'); mz.el.querySelector('.mzscroll').scrollTop = c.offsetTop - 60; return; }
  if (name === 'cat') mz.cat = arg;
  if (name === 'piece') { mz.sheet = {k:'piece', id:arg}; mz.opt = 0; mz.qty = 1; }
  if (name === 'opt') mz.opt = +arg;
  if (name === 'qty') mz.qty = Math.max(1, Math.min(20, mz.qty + +arg));
  if (name === 'bag') mz.sheet = {k:'bag'};
  if (name === 'orders') mz.sheet = {k:'orders'};
  if (name === 'signin') { mz.sheet = mz.sheet && mz.sheet.k === 'signin' ? mz.sheet : {k:'signin'}; if (form) { const email = val('email');

    else { mz.sent = null; mz.sheet = null; if (DB.gacct && DB.gacct.email.toLowerCase() === email.toLowerCase()) DB.mode = 'guest'; else DB.mode = 'member'; toast('Signed in'); } } }

  if (name === 'wish') { const k = DB.wish.indexOf(arg); k < 0 ? DB.wish.push(arg) : DB.wish.splice(k, 1); toast(k < 0 ? 'Added to your wishlist' : 'Removed from your wishlist'); }

      DB.orders.unshift(o); DB.bag = []; payRec('Maison Quintara order ' + o.id, o.total, guest ? val('gname') : '', 'order:' + o.id); if (!guest) note('bag', 'Order ' + o.id + ' is paid and being prepared', 'order:' + o.id); mz.sheet = {k:'done', id:o.id}; toast('Order placed'); } }
