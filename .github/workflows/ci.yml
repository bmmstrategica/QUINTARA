# Checks every push and pull request: types, tests, production builds, migrations on a real PostgreSQL, and the API image.
# Nothing here deploys. Deploys are a separate, approved step (docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # reads the version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test                       # API (on in-memory PostgreSQL), contract, security and client tests
      - name: Production builds
        run: |
          pnpm --filter @quintara/web build
          pnpm --filter @quintara/admin build
          pnpm --filter @quintara/maison build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - name: Dependency audit (reported, not blocking)
        run: pnpm audit --prod || true

  migrations:
    name: PostgreSQL 16 and Redis 7 (migrations, all tests, shared rate limits, load)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quintara
          POSTGRES_PASSWORD: quintara
          POSTGRES_DB: quintara
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quintara" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://quintara:quintara@localhost:5432/quintara
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration, twice (the second run must do nothing)
        run: |
          pnpm --filter @quintara/api migrate
          pnpm --filter @quintara/api migrate
      - name: First-run setup, twice (safe to repeat)
        run: |
          pnpm --filter @quintara/api run first-run
          pnpm --filter @quintara/api run first-run
        env:
          SETUP_ADMIN_EMAIL: ci-admin@example.com
          SETUP_ADMIN_NAME: CI Administrator
      - name: An S3-compatible server for the object storage tests (moto)
        run: |
          pip install --quiet 'moto[server]'
          moto_server -p 9100 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9100 && break; sleep 1; done
      - name: Every API test on PostgreSQL as the restricted production role, each server on a fresh database
        run: pnpm --filter @quintara/api test
        env:
          TEST_DATABASE_URL: postgres://quintara:quintara@localhost:5432/postgres
          TEST_ALL_ON_POSTGRES: '1'
          TEST_AS_APP_ROLE: '1'
          TEST_REDIS_URL: redis://localhost:6379
          TEST_S3_ENDPOINT: http://localhost:9100
          TEST_S3_KEY: test
          TEST_S3_SECRET: test
      - name: Load test (50 members at once for 20 seconds; fails on any error or p95 over 500 ms)
        run: pnpm --filter @quintara/api load
        env:
          LOAD_DATABASE_URL: postgres://quintara:quintara@localhost:5432/postgres
          LOAD_SECONDS: '20'
          LOAD_CONCURRENCY: '50'

  api-image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t quintara-api:ci .

  e2e:
    name: End-to-end journeys (web, admin, API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  e2e-production:
    name: End-to-end journeys on production builds (next build + next start)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_TARGET: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-production
          path: playwright-report/

  visual:
    name: Visual regression (web app screens, both themes, desktop and phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not blocking until the approved screenshots are recorded on this runner: font rendering differs slightly between
    # machines. Record them with `pnpm visual --update-snapshots` in this job's environment, review, commit, then remove
    # continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-differences
          path: test-results/
